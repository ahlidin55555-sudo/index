function drawHangarScene(){
  if(menu.style.display==='none')return;
  const bw=hangarBg.width=innerWidth,bh=hangarBg.height=innerHeight,g=hangarBg.getContext('2d');
  const sunX=bw*0.72,sunY=bh*0.76,sg=g.createRadialGradient(sunX,sunY,10,sunX,sunY,160);
  sg.addColorStop(0,'rgba(255,243,190,.95)');sg.addColorStop(0.3,'rgba(251,146,60,.55)');sg.addColorStop(1,'rgba(251,146,60,0)');
  g.fillStyle=sg;g.fillRect(0,0,bw,bh);
  g.fillStyle='#1e293b';g.beginPath();g.moveTo(0,bh*0.8);g.lineTo(bw*0.25,bh*0.71);g.lineTo(bw*0.55,bh*0.77);g.lineTo(bw*0.85,bh*0.69);g.lineTo(bw,bh*0.76);g.lineTo(bw,bh);g.lineTo(0,bh);g.fill();
  g.fillStyle='#0f172a';
  for(let tx=20;tx<bw;tx+=75){const th=28+(tx*17)%26,by=bh*0.79;g.beginPath();g.moveTo(tx,by-th);g.lineTo(tx-11,by);g.lineTo(tx+11,by);g.fill();}
  g.fillStyle='#cbd5e1';g.beginPath();g.moveTo(0,bh*0.83);g.quadraticCurveTo(bw*0.35,bh*0.78,bw,bh*0.85);g.lineTo(bw,bh);g.lineTo(0,bh);g.fill();

  // Т-34 на снежном холме
  g.save();g.translate(bw*0.24,bh*0.805);g.rotate(-0.04);
  g.fillStyle='rgba(15,23,42,.5)';g.beginPath();g.ellipse(0,14,76,8,0,0,Math.PI*2);g.fill();
  g.fillStyle='#1e293b';g.beginPath();g.roundRect(-68,0,136,16,7);g.fill();
  g.fillStyle='#475569';
  for(let k=-48;k<=48;k+=24){g.beginPath();g.arc(k,9,6.5,0,Math.PI*2);g.fill();g.strokeStyle='#0f172a';g.lineWidth=1.5;g.stroke();}
  g.fillStyle='#2f4529';g.strokeStyle='#141f11';g.lineWidth=1.8;
  g.beginPath();g.moveTo(-64,2);g.lineTo(-56,-14);g.lineTo(44,-14);g.lineTo(68,2);g.closePath();g.fill();g.stroke();
  g.fillStyle='#e2e8f0';g.fillRect(-66,-1,132,3);
  g.fillStyle='#5c3a21';g.fillRect(-46,-6,52,4);
  g.fillStyle='#385231';g.beginPath();g.moveTo(-34,-14);g.lineTo(-26,-34);g.lineTo(18,-34);g.lineTo(30,-22);g.lineTo(26,-14);g.closePath();g.fill();g.stroke();
  g.fillStyle='#f1f5f9';g.fillRect(-25,-36,42,3);
  g.fillStyle='#2f4529';g.fillRect(-16,-40,12,5);
  g.fillStyle='#24361f';g.fillRect(28,-27,64,5);g.strokeRect(28,-27,64,5);
  g.fillStyle='#385231';g.fillRect(24,-29,10,9);
  g.strokeStyle='rgba(253,186,116,.55)';g.lineWidth=1.5;g.beginPath();g.moveTo(44,-13);g.lineTo(66,1);g.stroke();
  g.restore();

  g.fillStyle='rgba(255,255,255,.75)';
  flakes.forEach(f=>{f.y+=f.s;f.x-=0.3;if(f.y>bh)f.y=-5;if(f.x<0)f.x=bw;g.beginPath();g.arc(f.x,f.y,f.r,0,Math.PI*2);g.fill();});
  requestAnimationFrame(drawHangarScene);
}

    for(let i=b.length-1;i>=0;i--){
      const p=b.slice(i,i+1).pop();p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>MW||p.y<0||p.y>MH||w.some(wl=>p.x>wl.x&&p.x<wl.x+wl.w&&p.y>wl.y&&p.y<wl.y+wl.h)){pt.push({x:p.x,y:p.y,r:(p.he?26:12)*(p.big?1.5:1),l:12,c:'#f39c12'});b.splice(i,1);continue;}
      const hit=u.find(t=>t.hp>0&&t.team!==p.team&&Math.hypot(t.x-p.x,t.y-p.y)<t.w*0.55);
      if(hit){
        const blocked=!p.he&&Math.random()<(p.big?hit.ar*0.08:hit.ar*0.16);
        const dmg=p.he?(hit.ar<0.35?p.d:Math.round(p.d*0.55)):(blocked?0:p.d);
        hit.hp=Math.max(0,hit.hp-dmg);
        pt.push({x:p.x,y:p.y,r:(p.he?32:16)*(p.big?1.5:1),l:16,c:blocked?'#95a5a6':(p.he?'#ff9f43':'#e74c3c'),txt:blocked?'РИКОШЕТ!':(p.he?'ОФ -'+dmg:'-'+dmg)});
        b.splice(i,1);
      }
    }

    bs.forEach(base=>{
      const t0=u.some(t=>t.hp>0&&t.team===0&&Math.hypot(t.x-base.x,t.y-base.y)<base.r),t1=u.some(t=>t.hp>0&&t.team===1&&Math.hypot(t.x-base.x,t.y-base.y)<base.r);
      if(t0&&!t1){if(base.c===1){base.p-=0.45;if(base.p<=0){base.c=-1;base.p=0;}}else if(base.c===-1){base.p+=0.45;if(base.p>=100){base.c=0;base.p=100;}}}
      else if(t1&&!t0){if(base.c===0){base.p-=0.45;if(base.p<=0){base.c=-1;base.p=0;}}else if(base.c===-1){base.p+=0.45;if(base.p>=100){base.c=1;base.p=100;}}}
      if(base.c===0)pts.splice(0,1,pts.slice(0,1).pop()+0.05);if(base.c===1)pts.splice(1,1,pts.slice(1,2).pop()+0.05);
    });
    if(isOnline&&isHost&&conn&&conn.open&&tick%2===0)conn.send({type:'state',u,b,pt,pts,bs});
  }
    x.fillStyle=map==='let'?'#2d4226':(map==='zim'?'#cfd9df':'#b89f6d');x.fillRect(0,0,W,H);
  x.save();const camX=me?me.x:MW/2,camY=me?me.y:MH/2;x.translate(W/2-camX*Z,H/2-camY*Z);x.scale(Z,Z);
  x.strokeStyle='rgba(0,0,0,.08)';x.lineWidth=2;
  for(let gx=0;gx<=MW;gx+=100){x.beginPath();x.moveTo(gx,0);x.lineTo(gx,MH);x.stroke();}
  for(let gy=0;gy<=MH;gy+=100){x.beginPath();x.moveTo(0,gy);x.lineTo(MW,gy);x.stroke();}
  x.strokeStyle='#e74c3c';x.lineWidth=6;x.strokeRect(0,0,MW,MH);

  bs.forEach(base=>{
    x.beginPath();x.arc(base.x,base.y,base.r,0,Math.PI*2);x.fillStyle=base.c===0?'rgba(46,204,113,.25)':(base.c===1?'rgba(231,76,60,.25)':'rgba(255,255,255,.12)');x.fill();
    x.strokeStyle=base.c===0?'#2ecc71':(base.c===1?'#e74c3c':'#fff');x.lineWidth=3;x.stroke();
    if(base.p>0&&base.p<100){x.beginPath();x.arc(base.x,base.y,base.r*(base.p/100),0,Math.PI*2);x.fillStyle='rgba(241,196,15,.25)';x.fill();}
    x.fillStyle='#fff';x.font='bold 24px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(base.id,base.x,base.y);
  });

  w.forEach(wl=>{x.fillStyle='#4a4e54';x.fillRect(wl.x,wl.y,wl.w,wl.h);x.strokeStyle='#222';x.lineWidth=3;x.strokeRect(wl.x,wl.y,wl.w,wl.h);});

  if(me){
    if(mouse.active){
      const wx=(mouse.x-W/2)/Z+me.x,wy=(mouse.y-H/2)/Z+me.y;
      x.strokeStyle='#f1c40f';x.lineWidth=2;x.beginPath();x.arc(wx,wy,14,0,Math.PI*2);x.stroke();
      x.beginPath();x.moveTo(wx-20,wy);x.lineTo(wx+20,wy);x.moveTo(wx,wy-20);x.lineTo(wx,wy+20);x.stroke();
    }else if(me.target&&Math.hypot(me.target.x-me.x,me.target.y-me.y)<750){
      x.save();x.translate(me.target.x,me.target.y);x.strokeStyle='rgba(231,76,60,.85)';x.lineWidth=2.5;x.beginPath();x.arc(0,0,me.target.w*0.68,0,Math.PI*2);x.stroke();x.restore();
    }
  }

  u.forEach(t=>{if(t.hp>0)drawTank(t);});
  b.forEach(p=>{x.save();x.translate(p.x,p.y);x.rotate(Math.atan2(p.vy,p.vx));const sc=p.big?1.8:1;x.fillStyle=p.he?'#ff7f50':(p.big?'#f1c40f':'#ffeaa7');x.fillRect(-7*sc,(p.he?-3.5:-2)*sc,14*sc,(p.he?7:4)*sc);x.restore();});
  for(let i=pt.length-1;i>=0;i--){
    const p=pt.slice(i,i+1).pop();p.l--;x.fillStyle=p.c;x.globalAlpha=Math.max(0,p.l/16);x.beginPath();x.arc(p.x,p.y,p.r*(1-p.l/22),0,Math.PI*2);x.fill();
    if(p.txt){x.font='bold 14px sans-serif';x.textAlign='center';x.fillText(p.txt,p.x,p.y-(16-p.l)*1.5);}
    x.globalAlpha=1;if(p.l<=0)pt.splice(i,1);
  }
  x.restore();

  const p0=pts.slice(0,1).pop(),p1=pts.slice(1,2).pop();
  if(me){
    const cdTxt=me.cd>0?(me.reloadingClip?'Барабан: '+(me.cd/60).toFixed(1)+'с':(me.cd/60).toFixed(1)+'с'):'ГОТОВ';
    hp.innerText=me.n+' | '+cdTxt;
    hpfill.style.width=Math.max(0,me.hp/me.mhp*100)+'%';hptxt.innerText=Math.ceil(me.hp)+' / '+Math.ceil(me.mhp);
    if(me.cl){let html='';const filled=me.reloadingClip?0:me.clip;for(let s=0;s<me.cl;s++)html+=`<div class="shell ${s<filled?'':'empty'}"></div>`;clipHud.innerHTML=html;}
  }
  const a0=u.filter(t=>t.team===0&&t.hp>0).length,a1=u.filter(t=>t.team===1&&t.hp>0).length;
  sc.innerText=mode==='sup'?`Очки: ${Math.floor(p0)}/1000 : ${Math.floor(p1)}/1000 | Живы: ${a0} vs ${a1}`:`Живы: ${a0} vs ${a1}`;

  if(a0===0||a1===0||p0>=1000||p1>=1000){
    run=0;const myT=me?me.team:0,win=(myT===0&&(a1===0||p0>=1000))||(myT===1&&(a0===0||p1>=1000));
    if(win&&mode==='boss'){const bId=BOSSES.slice(bIdx,bIdx+1).pop().id;if(!unlocked.includes(bId)){unlocked.push(bId);localStorage.setItem('bosses',JSON.stringify(unlocked));}}
    setTimeout(()=>{alert(win?'ПОБЕДА!':'ПОРАЖЕНИЕ!');location.reload();},300);return;
  }
  requestAnimationFrame(loop);
}
joy.addEventListener('touchmove',e=>{
  e.preventDefault();mouse.active=false;
  const t=e.targetTouches.item(0),r=joy.getBoundingClientRect();
  const dx=t.clientX-(r.left+57),dy=t.clientY-(r.top+57);
  const d=Math.min(42,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);
  jx=Math.cos(a)*(d/42);jy=Math.sin(a)*(d/42);
  stick.style.transform=`translate(${jx*36}px,${jy*36}px)`;
},{passive:false});
joy.addEventListener('touchend',()=>{jx=0;jy=0;stick.style.transform='translate(0,0)';});

fire.addEventListener('touchstart',e=>{e.preventDefault();fireHold=true;},{passive:false});
fire.addEventListener('touchend',e=>{e.preventDefault();fireHold=false;});
fire.addEventListener('mousedown',e=>{e.stopPropagation();fireHold=true;});
fire.addEventListener('mouseup',()=>fireHold=false);

ammo.addEventListener('touchstart',e=>{e.preventDefault();toggleAmmo();},{passive:false});
ammo.addEventListener('click',toggleAmmo);

reloadBtn.addEventListener('touchstart',e=>{e.preventDefault();forceReload();},{passive:false});
reloadBtn.addEventListener('click',forceReload);

window.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyE'||e.code==='Digit2')toggleAmmo();
  if(e.code==='KeyC')forceReload();
});
window.addEventListener('keyup',e=>keys[e.code]=false);

c.addEventListener('mousemove',e=>{mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true;});
c.addEventListener('mousedown',e=>{if(e.button===0)mouse.down=true;});
window.addEventListener('mouseup',()=>mouse.down=false);
</script>
